services:
  # Backend - Spring Boot API
  - type: web
    name: frc-efact-backend
    runtime: docker
    dockerfilePath: ./frc-efact-backend/Dockerfile
    dockerContext: ./frc-efact-backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: frc-efact-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: LOG_LEVEL
        value: INFO
      # GitHub Packages credentials (required for jsifenlib dependency)
      # IMPORTANT: Set these in Render Dashboard → Environment Variables
      # - key: GITHUB_USERNAME
      #   value: "your-github-username"
      # - key: GITHUB_TOKEN
      #   value: "your-github-personal-access-token"

  # Frontend - Angular SPA
  - type: web
    name: frc-efact-frontend
    runtime: static
    buildCommand: cd frc-efact-frontend && npm ci && npm run build:prod
    staticPublishPath: frc-efact-frontend/dist/frc-efact-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: frc-efact-db
    databaseName: frc_efact_db
    user: frc_efact_user
    plan: free
    region: oregon
