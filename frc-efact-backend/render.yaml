services:
  - type: web
    name: frc-efact-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: frc-efact-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /actuator/health
    
databases:
  - name: frc-efact-db
    databaseName: frc_efact_db
    user: frc_efact_user
