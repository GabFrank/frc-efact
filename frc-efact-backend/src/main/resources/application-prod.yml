spring:
  # Production Database Configuration
  # Note: DataSource is configured programmatically in DatabaseConfig.java
  # to handle Render's DATABASE_URL format conversion
  datasource:
    # HikariCP Configuration for Production
    hikari:
      connection-timeout: 30000
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      pool-name: FrcEfactHikariCP-Prod
      leak-detection-threshold: 60000

  # JPA Configuration for Production
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Flyway Configuration for Production
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
    schemas: public

# Production Server Configuration
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Management/Actuator Configuration for Production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true

# Production Security Configuration
security:
  require-ssl: true
  headers:
    frame-options: DENY
    content-type-options: nosniff
    xss-protection: 1; mode=block
    strict-transport-security: max-age=31536000; includeSubDomains

# Production Logging
logging:
  level:
    com.frcefact: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/frc-efact-backend.log
    max-size: 10MB
    max-history: 30

# CORS Configuration for Production
cors:
  allowed-origins:
    - https://frc-efact-frontend.onrender.com

# JWT Configuration for Production
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24 hours
  refresh-expiration-ms: 604800000  # 7 days

# Rate Limiting Configuration for Production
rate:
  limit:
    enabled: true  # Habilitar/deshabilitar rate limiting
    max-attempts: 100  # Máximo de intentos de login permitidos
    time-window-minutes: 15  # Ventana de tiempo en minutos