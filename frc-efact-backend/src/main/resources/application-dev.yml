spring:
  # Development Database Configuration
  datasource:
    # Puerto 5551 para desarrollo local
    # Nota: La base de datos debe existir previamente. PostgreSQL no la crea automáticamente.
    # Para crearla, ejecuta: psql -h localhost -p 5551 -U postgres -c "CREATE DATABASE frc_efact_dev;"
    # El default es la instancia de la LAN. Se puede sobreescribir con DATABASE_URL, que es lo
    # que hace el CI para apuntar al contenedor de PostgreSQL del job: sin eso, esta IP privada
    # no es ruteable desde un runner de GitHub y Flyway agota el connection-timeout tres veces
    # antes de fallar.
    url: ${DATABASE_URL:jdbc:postgresql://172.25.0.36:5551/frc_efact_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    
    # HikariCP Configuration for Development
    hikari:
      connection-timeout: 20000
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
      pool-name: FrcEfactHikariCP-Dev

  # JPA Configuration for Development
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Flyway Configuration for Development
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    locations: classpath:db/migration
    schemas: public
    repair: true  # Set to true to repair checksum mismatches on startup

  # Mail Configuration for Development
  # IMPORTANTE: Para desarrollo local, puedes configurar la contraseña aquí o usar la variable de entorno MAIL_PASSWORD
  # Si ejecutas desde el IDE, agrega la variable de entorno en la configuración de ejecución
  # Si ejecutas desde terminal, exporta: export MAIL_PASSWORD="tu-contraseña-sin-espacios"
  mail:
    password: ${MAIL_PASSWORD:CHANGE_ME}  # Cambia esto o configura MAIL_PASSWORD como variable de entorno

# Development Server Configuration
server:
  port: 8080
  address: 0.0.0.0  # Escuchar en todas las interfaces para acceso desde red local

# Development Logging
logging:
  level:
    com.frcefact: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
    org.hibernate.engine.internal: ERROR
    org.hibernate: WARN
    org.flywaydb: INFO
    org.postgresql: WARN
  file:
    name: logs/backend-dev.log

# CORS Configuration for Development
cors:
  allowed-origins:
    - http://localhost:4400
    - https://localhost:4400

# Certificates Configuration for Development
certificates:
  upload-dir: ${CERTIFICATES_DIR:./certificates}  # Directorio relativo para desarrollo

# SIFEN en desarrollo: APAGADO y apuntando al ambiente de prueba.
# Antes esto decía `enabled: true` / `ambiente: PROD`. Combinado con una base clonada de
# producción y los .pfx en ./certificates, correr ./dev.sh podía emitir documentos fiscales
# REALES contra SIFEN producción. El default de un perfil de desarrollo tiene que ser seguro.
# Para probar contra el ambiente de prueba de la SET, subir `enabled` a true dejando
# `ambiente: TEST`, y verificar que empresa.sifen_ambiente también sea TEST — SifenConfigFactory
# resuelve el endpoint por empresa, no por esta propiedad.
sifen:
  enabled: false
  ambiente: TEST
  scheduler:
    enabled: false

    

# Claves SOLO para desarrollo local. No tienen ningún valor en producción: allá las
# provee deploy/.env y `application.yml` no define default, así que la app no arranca
# si faltan. Ver docs/TAREAS_PENDIENTES.md §9.
jwt:
  secret: ${JWT_SECRET:solo-para-desarrollo-local-no-usar-en-produccion-jwt-hs512-minimo-512-bits-000}

encryption:
  secret-key: ${ENCRYPTION_KEY:SOLO-DEV-NO-USAR-EN-PRODUCCION12}
