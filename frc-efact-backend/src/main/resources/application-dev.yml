spring:
  # Development Database Configuration
  datasource:
    # Puerto 5551 para desarrollo local
    # Nota: La base de datos debe existir previamente. PostgreSQL no la crea automáticamente.
    # Para crearla, ejecuta: psql -h localhost -p 5551 -U postgres -c "CREATE DATABASE frc_efact_dev;"
    url: jdbc:postgresql://localhost:5551/frc_efact_dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    
    # HikariCP Configuration for Development
    hikari:
      connection-timeout: 20000
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
      pool-name: FrcEfactHikariCP-Dev

  # JPA Configuration for Development
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Flyway Configuration for Development
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    locations: classpath:db/migration
    schemas: public

# Development Server Configuration
server:
  port: 8080

# Development Logging
logging:
  level:
    com.frcefact: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
    org.hibernate.engine.internal: ERROR
    org.hibernate: WARN
    org.flywaydb: INFO
    org.postgresql: WARN

# CORS Configuration for Development
cors:
  allowed-origins:
    - http://localhost:4200
    - https://localhost:4200

# Certificates Configuration for Development
certificates:
  upload-dir: ${CERTIFICATES_DIR:./certificates}  # Directorio relativo para desarrollo