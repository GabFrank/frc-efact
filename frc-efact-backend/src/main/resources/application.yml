spring:
  application:
    name: frc-efact-backend
  profiles:
    active: dev
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging Configuration
logging:
  level:
    com.frcefact: INFO
    org.springframework.security: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:frc-efact-secret-key-change-this-in-production-minimum-512-bits-required}
  expiration-ms: 86400000  # 24 hours in milliseconds
  refresh-expiration-ms: 604800000  # 7 days in milliseconds

# Rate Limiting Configuration for Development
rate:
  limit:
    enabled: false  # Deshabilitado en desarrollo para facilitar testing
    max-attempts: 1000  # Muy permisivo en desarrollo
    time-window-minutes: 15
