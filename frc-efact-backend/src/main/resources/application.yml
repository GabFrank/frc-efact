spring:
  application:
    name: frc-efact-backend
  profiles:
    active: dev
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  # Mail Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: frcsistemasinformaticos@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging Configuration
logging:
  level:
    com.frcefact: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:frc-efact-secret-key-change-this-in-production-minimum-512-bits-required}
  expiration-ms: 86400000  # 24 hours in milliseconds
  refresh-expiration-ms: 604800000  # 7 days in milliseconds

# Encryption Configuration (AES-256)
encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:<REDACTADO-ENCRYPTION-KEY-ROTADA>}  # MUST be exactly 32 characters (256 bits)

# Certificates Configuration
certificates:
  upload-dir: ${CERTIFICATES_DIR:/var/certificates}  # Directorio para almacenar certificados PFX

# SIFEN global configuration (multi-empresa compatible)
sifen:
  enabled: true                    # true para habilitar integración (por defecto deshabilitado en dev)
  ambiente: PROD                    # TEST o PROD; se usa como valor por defecto
  habilitar-nota-tecnica-13: true
  tipo-contribuyente-emisor: 2      # 1=Persona Física, 2=Persona Jurídica (default emisor)
  scheduler:
    enabled: false                  # Scheduler deshabilitado inicialmente (multi-empresa requiere validación)
    fixed-delay: 300000             # 5 minutos
  lote:
    max-size: 50                    # Tamaño máximo por lote
    max-retries: 5                  # Reintentos antes de marcar ERROR_PERMANENTE

# Rate Limiting Configuration for Development
rate:
  limit:
    enabled: false  # Deshabilitado en desarrollo para facilitar testing
    max-attempts: 1000  # Muy permisivo en desarrollo
    time-window-minutes: 15
