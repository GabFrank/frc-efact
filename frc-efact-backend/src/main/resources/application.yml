spring:
  application:
    name: frc-efact-backend
  profiles:
    active: dev
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-gp1w0u2bgw35q6v5.us.auth0.com/
          audiences: https://api.frcefact.com

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: frcsistemasinformaticos@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.frcefact: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
  file:
    name: logs/backend-dev.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

# JWT Configuration
jwt:
  # SIN default a propósito: si falta JWT_SECRET, la app NO arranca.
  # Un default acá significa firmar tokens con una clave que está en el repo.
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours

# Encryption Configuration
encryption:
  # SIN default a propósito. El default que había acá era el valor que producción usaba
  # realmente, así que la clave que cifra los CSC y los passwords de los certificados
  # estaba versionada. Rotada el 2026-08-05; el valor anterior NO se documenta porque los
  # backups previos a esa fecha siguen cifrados con él.
  # Los valores de desarrollo viven en application-dev.yml.
  secret-key: ${ENCRYPTION_KEY}
