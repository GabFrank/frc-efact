<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>FRC eFact</mat-card-title>
      <mat-card-subtitle>Iniciar Sesión</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input
            matInput
            formControlName="username"
            placeholder="Ingrese su usuario"
            autocomplete="username"
            [attr.data-cy]="'username'">
          <mat-icon matPrefix>person</mat-icon>
          <mat-error>{{ getFieldError('username') }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            [attr.data-cy]="'password'">
          <mat-icon matPrefix>lock</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Mostrar contraseña'"
            [attr.aria-pressed]="!hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ getFieldError('password') }}</mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage$ | async as errorMessage">
          <mat-icon>error</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width login-button"
          [disabled]="isLoading$ | async"
          [attr.data-cy]="'login-button'">
          <span *ngIf="!(isLoading$ | async)">Iniciar Sesión</span>
          <mat-spinner *ngIf="isLoading$ | async" diameter="20"></mat-spinner>
        </button>

        <div style="margin: 20px 0; display: flex; align-items: center; justify-content: center;">
          <span style="color: #666; background: #fff; padding: 0 10px; z-index: 1;">O</span>
          <div style="position: absolute; border-top: 1px solid #e0e0e0; width: 80%;"></div>
        </div>

        <button
          mat-stroked-button
          type="button"
          class="full-width"
          (click)="loginWithAuth0()"
          [disabled]="isLoading$ | async">
          <mat-icon>login</mat-icon>
          Iniciar con Auth0 / Google
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
