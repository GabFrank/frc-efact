<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FRC eFACT</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de facturación electrónica FRC eFACT">
  <meta name="theme-color" content="#1976d2">
  
  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="16x16" href="assets/16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/64.png">
  <link rel="icon" type="image/png" sizes="128x128" href="assets/128.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/152.png">
  <link rel="apple-touch-icon" sizes="144x144" href="assets/144.png">
  <link rel="apple-touch-icon" sizes="120x120" href="assets/120.png">
  <link rel="apple-touch-icon" sizes="114x114" href="assets/114.png">
  <link rel="apple-touch-icon" sizes="100x100" href="assets/100.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f8f9fa 0%, #ecf0f1 100%);
      font-family: Roboto, 'Helvetica Neue', sans-serif;
      transition: opacity 0.4s ease-out;
    }
    #app-splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #app-splash .splash-logo-wrap {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }
    #app-splash .splash-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #app-splash .splash-title {
      font-size: 1.25rem;
      font-weight: 500;
      color: #2c3e50;
      text-align: center;
      max-width: 320px;
      margin: 0 0 32px 0;
      line-height: 1.4;
    }
    #app-splash .splash-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="mat-typography">
  <div id="app-splash">
    <div class="splash-logo-wrap">
      <img src="assets/256.png" alt="FRC eFact" />
    </div>
    <p class="splash-title">Gestión de facturación electrónica</p>
    <div class="splash-spinner" aria-hidden="true"></div>
  </div>
  <app-root></app-root>
</body>
</html>
