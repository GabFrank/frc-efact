# FRC eFact — vhost para el nginx del HOST (VM Hetzner compartida, Fedora 42)
# Instalar como /etc/nginx/conf.d/frc-efact.conf y luego correr:
#   sudo certbot --nginx -d efact.frc-ecommerce.com
# (certbot agrega el bloque TLS/443 y el redirect, igual que en farmacia-franco.conf)
#
# Dominio único: / → SPA Angular (contenedor, 127.0.0.1:8082)
#                /api → backend Spring Boot (contenedor, 127.0.0.1:8081)
# Requiere SELinux boolean httpd_can_network_connect=on (ya activo: el nginx
# del host ya proxya a farmacia:3000 y headscale:8080).

server {
    listen 80;
    server_name efact.frc-ecommerce.com;

    # Uploads de certificados .pfx y XMLs — margen holgado
    client_max_body_size 20m;

    # API Spring Boot (el context-path /api ya lo maneja el backend)
    location /api {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # KuDE PDF / consultas SIFEN pueden tardar
        proxy_read_timeout 120s;
    }

    # SPA Angular
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
