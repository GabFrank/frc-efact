name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# Un PR que recibe varios pushes seguidos cancela los runs viejos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · compile + package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # jsifenlib vive en GitHub Packages de OTRO repo (GabFrank/rshk-jsifenlib),
      # así que el GITHUB_TOKEN automático del job no alcanza: hace falta un PAT
      # con scope read:packages en el secret GH_PACKAGES_TOKEN.
      - name: Configurar Maven para GitHub Packages
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "${GH_PACKAGES_TOKEN}" ]; then
            echo "::error::Falta el secret GH_PACKAGES_TOKEN (PAT con scope read:packages)."
            echo "::error::Sin él, Maven no puede bajar jsifenlib de GitHub Packages y falla con 401."
            echo "::error::Cargarlo en Settings -> Secrets and variables -> Actions. Ver CONTRIBUTING.md."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github-jsifenlib</id>
                <username>${GH_PACKAGES_USER}</username>
                <password>${GH_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build (sin tests)
        working-directory: frc-efact-backend
        run: ./mvnw -B -ntp clean package -DskipTests

  backend-tests:
    name: Backend · tests
    runs-on: ubuntu-latest
    # BLOQUEANTE desde el 2026-08-06. Antes tenía `continue-on-error` porque fallaban 6 tests
    # de validación de RUC, atribuidos a un bug del algoritmo de dígito verificador. Resultó
    # que el algoritmo era correcto y las expectativas de los tests estaban inventadas — ver
    # el javadoc de RucCalculatorTest.
    #
    # El job necesita PostgreSQL porque `FrcEfactBackendApplicationTests` es un @SpringBootTest
    # sin @ActiveProfiles, así que hereda `spring.profiles.active: dev` de application.yml y
    # levanta el contexto completo contra una base real. Sin el servicio de abajo, ese test
    # apuntaba a la IP de LAN del perfil dev, que no es ruteable desde un runner.
    #
    # Que corra contra PostgreSQL de verdad y no contra H2 es a propósito: H2 no soporta las
    # funciones trigger PL/pgSQL ni los esquemas y JSONB que usan las migraciones. Así este job
    # verifica de paso que las 36 migraciones Flyway aplican limpias desde cero y que
    # `ddl-auto: validate` coincide con todas las entidades — el gate más valioso disponible
    # para un proyecto donde una migración mal hecha es el riesgo número uno.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frc_efact_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Configurar Maven para GitHub Packages
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "${GH_PACKAGES_TOKEN}" ]; then
            echo "::error::Falta el secret GH_PACKAGES_TOKEN (PAT con scope read:packages)."
            echo "::error::Sin él, Maven no puede bajar jsifenlib de GitHub Packages y falla con 401."
            echo "::error::Cargarlo en Settings -> Secrets and variables -> Actions. Ver CONTRIBUTING.md."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github-jsifenlib</id>
                <username>${GH_PACKAGES_USER}</username>
                <password>${GH_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Tests
        working-directory: frc-efact-backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/frc_efact_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: ./mvnw -B -ntp test

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: frc-efact-backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend · build prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frc-efact-frontend/package-lock.json

      - name: Install
        working-directory: frc-efact-frontend
        run: npm ci

      # NOTA: no se corre `npm run lint` — el target `lint` NO existe en
      # angular.json (solo build/serve/extract-i18n/test). Agregar
      # @angular-eslint/schematics es una tarea aparte; hasta entonces, el build
      # de producción (AOT) es el gate real del frontend.
      - name: Build producción
        working-directory: frc-efact-frontend
        run: npm run build:prod
